[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-string-algorithms"
version = "0.1.0"
description = "Advanced string matching and indexing algorithms in pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Waldo Wen"}]
keywords = ["algorithms", "string-matching", "suffix-tree", "bwt", "rabin-karp", "miller-rabin"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
